# Netlify deployment for TrialBridge TW (Next.js 16 through Netlify's OpenNext
# adapter, auto-detected; no publish directory is set on purpose).
#
# Required environment variables are listed in docs/DEPLOYMENT.md. Secrets
# (OLLAMA_API_KEY, TRIAL_INDEX_LIBSQL_AUTH_TOKEN) belong in the Netlify UI, not
# in this file.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Hosted functions have no durable disk and a short synchronous limit: use
  # the remote libSQL index, never download the TFDA export inside a request,
  # and widen the model-backed rate limits for a judging session.
  TRIAL_INDEX_BACKEND = "libsql"
  TRIAL_INDEX_LIBSQL_READ_ONLY = "true"
  TFDA_LIVE_FALLBACK = "false"
  RATE_LIMIT_PROFILE = "demo"
  # Keep one extraction well inside the platform ceiling; the route streams so
  # headers go out immediately either way.
  CLOUD_EXTRACTION_TIMEOUT_MS = "55000"

[functions]
  node_bundler = "esbuild"
  # Bundled public data (NCI terminology snapshot). The trial index itself is
  # remote; no database file ships with the functions.
  included_files = ["data/public/**"]

# Security headers are generated by next.config.ts headers() so the same
# values apply in every environment; they are intentionally not duplicated here.
