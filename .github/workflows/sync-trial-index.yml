name: Sync public trial index

on:
  schedule:
    # Tue-Sat 02:00 Asia/Taipei: incremental after the Mon-Fri CTG refresh.
    - cron: "0 18 * * 1-5"
    # Monday 02:00 Asia/Taipei: full reconciliation, including removals.
    - cron: "0 18 * * 0"
  workflow_dispatch:
    inputs:
      source:
        description: Public registry to synchronize
        required: true
        default: all
        type: choice
        options: [all, tfda, ctgov]
      force:
        description: Ignore an unchanged ClinicalTrials.gov dataTimestamp
        required: false
        default: false
        type: boolean

concurrency:
  group: trial-index-production-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      # Production index lives in Turso (libSQL). The read-write token is a
      # repository secret; Netlify functions use a separate read-only token.
      TRIAL_INDEX_BACKEND: libsql
      TRIAL_INDEX_LIBSQL_URL: ${{ secrets.TRIAL_INDEX_LIBSQL_URL }}
      TRIAL_INDEX_LIBSQL_AUTH_TOKEN: ${{ secrets.TRIAL_INDEX_LIBSQL_AUTH_TOKEN }}
      TRIAL_INDEX_PROFILE: ${{ vars.TRIAL_INDEX_PROFILE || 'full' }}
      TFDA_LIVE_FALLBACK: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Require durable production database
        shell: bash
        run: |
          case "$TRIAL_INDEX_LIBSQL_URL" in
            libsql://*|https://*) ;;
            *)
              echo "TRIAL_INDEX_LIBSQL_URL is not a remote libsql:// database; refusing an ephemeral scheduled sync."
              exit 1
              ;;
          esac
          if [ -z "$TRIAL_INDEX_LIBSQL_AUTH_TOKEN" ]; then
            echo "TRIAL_INDEX_LIBSQL_AUTH_TOKEN is not configured."
            exit 1
          fi
      - name: Synchronize public registries
        shell: bash
        env:
          SELECTED_SOURCE: ${{ inputs.source || 'all' }}
          FORCE_SYNC: ${{ inputs.force || false }}
          SCHEDULE_EXPRESSION: ${{ github.event.schedule }}
        run: |
          args=("--source=$SELECTED_SOURCE")
          if [ "$FORCE_SYNC" = "true" ] || [ "$SCHEDULE_EXPRESSION" = "0 18 * * 0" ]; then args+=("--force"); fi
          npm run sync:trial-index -- "${args[@]}"
